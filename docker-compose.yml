##############################################################################
# spintronic_fl/docker-compose.yml
# =============================================================================
# 1 Flower server  +  15 spintronic sensor clients
#
# TWO ANCHORS — never nest one inside the other:
#   x-client-svc : service-level keys (build, depends_on, networks, restart)
#   x-client-env : environment variables only
# This avoids the YAML cycle error from referencing a service-level anchor
# from inside an environment block.
##############################################################################

x-client-svc: &client-svc
  build:
    context: ./client
    dockerfile: Dockerfile
  depends_on:
    server:
      condition: service_healthy
  networks:
    - fl_network
  restart: on-failure
  volumes:
    - ${DATA_ROOT:-/tmp/spintronic_data}:/data:ro
    - ./cache:/cache    # ← cache persistente entre runs

x-client-env: &client-env
  SERVER_ADDRESS:   "server:8080"
  PROX_MU:          "0.1"
  LOCAL_EPOCHS:     "5"
  BATCH_SIZE:       "64"
  LR:               "1e-4"
  SIMULATE_DATA:    "false"   # set "true" for dry-run without BSD files
  BASELINE_WIN_MIN: "120"
  K_MAIN:           "4"
  MIN_SUB_SIZE:     "20"
  EMD_STAGGER_SECONDS: "60"   # each client waits CLIENT_ID × 60s before starting EMD
  CACHE_DIR: "/cache"


services:

  # ── SERVER ─────────────────────────────────────────────────────────────────
  server:
    build:
      context: ./server 
      dockerfile: Dockerfile
    networks:
      - fl_network
    ports:
      - "8080:8080"
    environment:
      FL_ROUNDS:          "20"
      MIN_CLIENTS:        "15"
      PROX_MU:            "0.1"
      PRETRAINED_WEIGHTS: "/app/global_model.pt"
      SAVE_DIR:           "/app/checkpoints"
      PORT:               "8080"
    volumes:
      - ./server/checkpoints:/app/checkpoints
      - ./server/global_model.pt:/app/global_model.pt:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',8080)); s.close()\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: "no" #unless-stopped

  # ── CLIENTS 01-08 — one full day each ──────────────────────────────────────

  client_01:
    <<: *client-svc
    environment:
      <<: *client-env
      CLIENT_ID:    "1"
      TARGET_DATE:  "20250204"
      TIME_START_H: "0"
      TIME_END_H:   "24"
    volumes:
      - ${DATA_ROOT:-/tmp/spintronic_data}:/data:ro

